<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">  
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Roboto&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifes">
</head>
<body>
    <div class="container">
        <div class="branding">
            <div class="logo">
                <img src="favicon_io/logo.png" alt="logo">
            </div>
            <div class="text">
                <span>Explore the things</span>
                <span style="color:blue;">you love</span>
            </div>
            <div class="bg">
                <img src="favicon_io/bg.png" alt="">
            </div>
        </div>
        <div class="formContainer">
            <h3>Log in to Facebook</h3>
            <form action="https://facebook.com">
                <div class="emailInput">
                    <input type="email" name="email" id="email" placeholder="Email address or mobile number" required>
                </div>
                <div class="passwordInput">
                    <input type="password" name="password" id="password" placeholder="Password" required oninput="showIcon()">
                    <i onclick="showPassword()" id="icon" class="far fa-eye-slash"></i>
                </div>
                <div class="loginBtn">
                    <button type="submit">Log in</button>
                </div>
                <p id="forgotPass">Forgotten password?</p>
                <div class="createAcc">
                    <button>Create new account</button>
                </div>
                <div class="meta">
                    <img src="favicon_io/meta.svg" alt="meta"><span>Meta</span>
                </div>
            </form>
        </div>
    </div>








    <footer id="footerone">
        <p>English (UK) &nbsp;
            नेपाली &nbsp;
            हिन्दी &nbsp;
            Español &nbsp;
            Português (Brasil) &nbsp;
            日本語 &nbsp;
            Français (France) &nbsp;
            Deutsch &nbsp;
            Italiano &nbsp;
            العربية &nbsp;
            中文(简体) &nbsp;
            More languages ...
        </p>
        <p>
            Meta ©
            <span id="year"></span>
        </p>
    </footer>
    <script>
        function togglePassword() {
            var input = document.getElementById('pass');
            var icon = document.getElementById('icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
        const getYear = new Date().getFullYear();
        const putYear = document.getElementById("year").textContent = getYear;

        function showIcon(){
            const icon = document.getElementById('icon');
            const password = document.getElementById('password');

            if(password.value.length > 0){
                icon.classList.add("show");
            }
            else{
                icon.classList.remove("show");
            }
        }
        function showPassword(){
            const icon = document.getElementById('icon');
            const password = document.getElementById('password');
            
            if(password.type === "password"){
                password.type = "text";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
            else{
                password.type = "password";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            }
        }
</script>
</body>
</html>
